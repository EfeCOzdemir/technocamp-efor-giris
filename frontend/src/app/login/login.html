<main class="login-page">
  <section class="brand">
    <div class="logo"><mat-icon>schedule</mat-icon></div>
    <h1>Efor Takip</h1>
    <p>Haftalık mesai, mola ve mazeret kayıtlarını tek ekrandan yönetin.</p>
  </section>

  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <h2>Giriş yap</h2>

    <mat-form-field>
      <mat-label>Kullanıcı adı</mat-label>
      <input matInput formControlName="username" autocomplete="username" />
      <mat-icon matPrefix>person</mat-icon>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Şifre</mat-label>
      <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'" autocomplete="current-password" />
      <mat-icon matPrefix>lock</mat-icon>
      <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())"
              [attr.aria-label]="hidePassword() ? 'Şifreyi göster' : 'Şifreyi gizle'">
        <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="form.invalid || loading()">Giriş</button>

    <p class="hint">Demo: <code>admin / admin123</code> · <code>ayse / ayse123</code> · <code>mehmet / mehmet123</code></p>
  </form>
</main>
